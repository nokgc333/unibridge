name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: black --check .
      - run: isort --check .
      - run: flake8 .
      - run: mypy core/ commands/ cli.py webui/
      - name: "静的チェック: core/配下がhou/bpyをimportしていないこと（境界検証）"
        run: |
          if grep -rn "^import hou\|^from hou\|^import bpy\|^from bpy" core/; then
            echo "core/ must not depend on hou or bpy"; exit 1
          fi
      - name: "静的チェック: exec/evalの不使用（SEC-002）"
        run: |
          if grep -rn "exec(\|eval(" core/ commands/ adapters/ cli.py webui/; then
            echo "exec/eval must not be used"; exit 1
          fi
      - run: pip-audit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: pytest --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: "インストールして、別のディレクトリから動くこと"
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/unibridge" hierarchy-check --usd "$GITHUB_WORKSPACE/sample_scenes/consistent_scene.usda"

[project]
name = "unibridge"
version = "0.2.0"
description = "Houdini SolarisとBlenderの間で受け渡すOpenUSDシーンの整合(座標系・スケール・命名・参照・マテリアル)を検査するツール"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "naokikaneko" }]
keywords = ["usd", "openusd", "houdini", "blender", "pipeline", "validation", "vfx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "usd-core>=25.11",
    "PyYAML>=6.0.2,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/nokgc333/unibridge"
Repository = "https://github.com/nokgc333/unibridge"
Changelog = "https://github.com/nokgc333/unibridge/blob/main/CHANGELOG.md"

[project.scripts]
unibridge = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "build>=1.2",
    "twine>=5.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "webui*", "commands*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.package-data]
core = ["default_rules.yaml"]
webui = ["static/*"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
# adapters/ は hou/bpy スタブが無いため型チェック対象から除外する
exclude = ["adapters/"]

[[tool.mypy.overrides]]
# usd-core(pxr)はpy.typed/型スタブを同梱していないため、このモジュールに限りimportエラーを無視する
module = "pxr.*"
ignore_missing_imports = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=core --cov=commands --cov=adapters --cov-report=term-missing"
testpaths = ["tests"]
# tests/fakes.py 等を `from tests....` で参照するテストがあっても、
# 素の `pytest` 起動（CIの起動方法）でリポジトリルートを sys.path に含める
# （scene_doctorの既知バグ対策と同一設定）。
pythonpath = ["."]

[tool.coverage.run]
branch = true

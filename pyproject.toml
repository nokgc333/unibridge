[project]
name = "unibridge"
version = "0.1.0"
description = "Houdini SolarisとBlenderのUSD I/OでOpenUSDシーンを相互変換・検証するツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "usd-core>=24.8,<25",
    "PyYAML>=6.0.2,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "black>=24.0",
    "flake8>=7.1",
    "isort>=5.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "types-PyYAML",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "webui*"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
# adapters/ は hou/bpy スタブが無いため型チェック対象から除外する
exclude = ["adapters/"]

[[tool.mypy.overrides]]
# usd-core(pxr)はpy.typed/型スタブを同梱していないため、このモジュールに限りimportエラーを無視する
module = "pxr.*"
ignore_missing_imports = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--cov=core --cov-report=term-missing"
testpaths = ["tests"]
# tests/fakes.py 等を `from tests....` で参照するテストがあっても、
# 素の `pytest` 起動（CIの起動方法）でリポジトリルートを sys.path に含める
# （scene_doctorの既知バグ対策と同一設定）。
pythonpath = ["."]

[tool.coverage.run]
# adapters/ は hou/bpy が無い環境では実行できないため、カバレッジ計測から除外する
# （scene_doctorと同一方針）。
omit = ["adapters/*"]
